<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>EyeLand</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="black">
<div id="stage">

  <!-- Persistent info header: weather · time · date -->
  <div id="bar" class="bar">
    <button id="barWeather" class="bar-l" type="button" aria-label="Weather and location">
      <span id="wxIcon" class="bar-ico"></span><b id="wxTemp" class="mono"></b><span id="wxCity" class="bar-city"></span>
    </button>
    <time id="barClock" class="bar-c mono"></time>
    <div class="bar-r"><span id="barDate"></span><span id="barCond" class="bar-cond"></span></div>
  </div>

  <!-- The island: one shape that morphs between idle, activity and expanded -->
  <div id="island" data-mode="idle">
    <div class="layer l-idle" aria-hidden="true"><span id="ambient" class="ambient"></span></div>

    <div class="layer l-activity"><div id="actSlot" class="slot"></div></div>

    <div class="layer l-panel">
      <!-- TOP: dynamic activity section (music, lyrics, downloads, conversions, QuickShare, timers...) -->
      <section id="topSection" class="top" aria-label="Activity">
        <div id="topSlot" class="slot"></div>
        <div id="topEmpty" class="top-empty"><span class="top-empty-ico"></span><span>Nothing happening</span></div>
      </section>

      <!-- BOTTOM: workspace (favourites, plugin search and navigation, tools, system controls) -->
      <section class="work" aria-label="Workspace">
        <nav id="nav" class="rail" aria-label="Workspace sections">
          <button data-tab="home" aria-label="Home"></button>
          <button data-tab="apps" aria-label="Plugins"></button>
          <button data-tab="timer" aria-label="Focus timer"></button>
          <button data-tab="tasks" aria-label="Tasks"></button>
          <button data-tab="clips" aria-label="Clipboard"></button>
          <button data-tab="settings" aria-label="Settings"></button>
        </nav>

        <main class="content">
          <section class="tab" data-tab="home">
            <div class="home">
              <div class="search" aria-disabled="true" title="Plugin search is coming soon"><span class="search-ico"></span><span>Search plugins</span></div>
              <div class="home-grid">
                <div class="card">
                  <span class="label">Quick access</span>
                  <div id="quickGrid" class="quick"></div>
                </div>
                <div class="card">
                  <span class="label">System</span>
                  <div class="srows">
                    <div class="srow">
                      <div class="srow-top"><button id="homeVolIcon" class="ico-btn" aria-label="Mute"></button><span>Volume</span><span id="homeVolNum" class="num">0</span></div>
                      <input id="homeVol" type="range" min="0" max="100" aria-label="Volume">
                    </div>
                    <div class="srow" id="briRow">
                      <div class="srow-top"><span id="homeBriIcon" class="ico-btn static"></span><span>Brightness</span><span id="homeBriNum" class="num">0</span></div>
                      <input id="homeBri" type="range" min="0" max="100" aria-label="Brightness">
                    </div>
                    <div class="srow bat" id="batRow">
                      <div class="srow-top"><span id="homeBatIcon" class="ico-btn static"></span><span>Battery</span><span id="homeBatNum" class="num"></span></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="tab" data-tab="apps"><div id="appsGrid" class="apps"></div></section>

          <section class="tab" data-tab="timer">
            <div class="timer card">
              <div class="chips"><button data-tmode="focus">Focus</button><button data-tmode="break">Break</button></div>
              <div id="timerBig" class="timer-big mono">25:00</div>
              <div class="timer-bar"><div id="timerFill"></div></div>
              <div class="timer-actions"><button id="timerToggle" class="btn primary">Start</button><button id="timerReset" class="btn">Reset</button></div>
              <span id="timerCount" class="sub">0 focus sessions today</span>
            </div>
          </section>

          <section class="tab" data-tab="tasks">
            <div class="tasks">
              <div class="task-add"><input id="taskInput" placeholder="Add a task and press Enter" maxlength="200" autocomplete="off"><button id="taskAdd" class="btn">Add</button></div>
              <div id="taskList" class="task-list"></div>
            </div>
          </section>

          <section class="tab" data-tab="clips">
            <div class="list-head"><span class="label">Clipboard history</span><button id="clipClear" class="link-btn">Clear</button></div>
            <div id="clipList" class="clip-list"></div>
          </section>

          <section class="tab" data-tab="settings">
            <div class="settings-scroll">
              <div id="locBlock" class="loc card">
                <div class="loc-head"><span class="label">Location</span><span id="locName" class="loc-name">Not set</span></div>
                <div class="loc-actions">
                  <button id="locDevice" class="btn" type="button">Use my location</button>
                  <button id="locClear" class="btn" type="button">Clear</button>
                </div>
                <input id="locSearch" class="loc-search" placeholder="Search for a city" autocomplete="off" maxlength="80">
                <div id="locResults" class="loc-results"></div>
                <div id="locMsg" class="loc-msg" role="status"></div>
              </div>
              <div id="settingsForm" class="settings"></div>
            </div>
          </section>
        </main>
      </section>
    </div>
  </div>
</div>

<script src="../shared/activity-manager.js"></script>
<script src="../shared/motion.js"></script>
<script src="../shared/lucide.js"></script>
<script src="../shared/weather-codes.js"></script>
<script src="../shared/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/engine.js"></script>
<script src="js/header.js"></script>
<script src="js/feeds.js"></script>
<script src="js/workspace.js"></script>
<script src="renderer.js"></script>
</body>
</html>
